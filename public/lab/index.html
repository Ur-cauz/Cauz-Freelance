<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Read-only live view of the CAUZ LAB homelab: containers, services, host stats, migration, backups and alerts.">
  <title>CAUZ LAB · Live view</title>
  <link rel="icon" type="image/svg+xml" href="/lab/favicon.svg">
  <link rel="stylesheet" href="/lab/styles.css">
  <script src="/lab/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <header class="top">
    <div class="top-in">
      <a class="brand" href="/lab"><span class="brand-name">CAUZ LAB</span><span class="brand-sub">Live view</span></a>
      <div class="top-actions">
        <span class="live" id="live" data-state="unknown"><span class="led"></span><span id="live-text">Connecting…</span></span>
        <span class="badge">View only</span>
        <button class="btn" type="button" id="theme-btn" aria-label="Switch colour theme">Theme</button>
      </div>
    </div>
    <div class="alarmbar" id="alarmbar" data-state="unknown" role="status" aria-live="polite"><span class="sev"></span><span id="alarm-msg">Reading alarm state…</span></div>
  </header>
  <div class="banner" id="banner" role="status" hidden></div>
  <main class="content" id="view" tabindex="-1">
    <p class="muted">Loading…</p>
  </main>
  <footer class="foot"><span>Powered by CAUZ LAB</span><span class="muted">Read-only snapshot · no control access · refreshes every minute</span></footer>
  <noscript><p class="muted pad">This page needs JavaScript to show live data.</p></noscript>
</body>
</html>
